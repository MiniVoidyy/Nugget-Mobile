name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout theos/theos
        uses: actions/checkout@main
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout theos/sdks
        uses: actions/checkout@main
        with:
          repository: theos/sdks
          ref: master
          nugget-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Ensure main utils are installed
        uses: dhinakg/procursus-action@main
        with:
          packages: coreutils make xz ldid

      - name: Install Swift 5.8.1 toolchain
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/swift.pkg https://download.swift.org/swift-5.8.1-release/xcode/swift-5.8.1-RELEASE/swift-5.8.1-RELEASE-osx.pkg
          sudo installer -pkg /tmp/swift.pkg -target /
          TC="$(ls -d /Library/Developer/Toolchains/*.xctoolchain | head -n1)"
          echo "Toolchain: $TC"
          SWIFT_INC="$TC/usr/lib/swift/clang/include"
          echo "Writing __stddef_max_align_t.h into $SWIFT_INC"
          sudo tee "$SWIFT_INC/__stddef_max_align_t.h" >/dev/null <<'EOF'
#ifndef __stddef_max_align_t_h
#define __stddef_max_align_t_h
typedef long double max_align_t;
#endif
EOF
          ls -l "$SWIFT_INC/__stddef_max_align_t.h"

      - name: Build
        run: |
          export THEOS=theos
          export TARGET_SWIFTC="$(ls -d /Library/Developer/Toolchains/*.xctoolchain | head -n1)/usr/bin/swiftc"
          "$TARGET_SWIFTC" --version

          git submodule update --init
          bash get_libraries.sh
          bash ipabuild.sh

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: artifact
          path: build/*.ipa
