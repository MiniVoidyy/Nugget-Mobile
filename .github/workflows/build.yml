name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Checkout theos/theos
        uses: actions/checkout@main
        with:
          repository: theos/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout theos/sdks
        uses: actions/checkout@main
        with:
          repository: theos/sdks
          ref: master
          nugget-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Ensure main utils are installed
        uses: dhinakg/procursus-action@main
        with:
          packages: coreutils make xz ldid

      - name: Install Swift 5.8.1 toolchain
        run: |
          set -e
          mkdir -p "$HOME/Library/Developer/Toolchains" /tmp/swiftpkg
          curl -fL --retry 3 -o /tmp/swift.pkg https://download.swift.org/swift-5.8.1-release/xcode/swift-5.8.1-RELEASE/swift-5.8.1-RELEASE-osx.pkg
          pkgutil --expand-full /tmp/swift.pkg /tmp/swiftpkg
          TC="$(find /tmp/swiftpkg -type d -name '*.xctoolchain' | head -n 1)"
          cp -R "$TC" "$HOME/Library/Developer/Toolchains/"

      - name: Build
        run: |
          export THEOS=theos
          export TARGET_SWIFTC="$HOME/Library/Developer/Toolchains/swift-5.8.1-RELEASE.xctoolchain/usr/bin/swiftc"

          git submodule update --init
          bash get_libraries.sh
          bash ipabuild.sh

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: artifact
          path: build/*.ipa
